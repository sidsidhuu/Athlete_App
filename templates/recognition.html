<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Recognition - Athlete Activity Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="recognition-page">
    <nav>
        <div class="nav-container">
            <h2>Athlete Activity Recognition</h2>
            <ul>
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('profile') }}">Profile</a></li>
                <li><a href="{{ url_for('recognition') }}">Recognition</a></li>
                <li><a href="{{ url_for('settings') }}">Settings</a></li>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Real-time Activity Recognition</h1>
        <div class="recognition-container">
            <p>The camera will open in a separate OpenCV window when recognition starts.</p>
            <div class="camera-container">
                <video id="video" autoplay playsinline style="display:none; width: 100%; max-width: 640px; border: 2px solid #333;"></video>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
            <div class="results">
                <h2>Status: <span id="status">Not Started</span></h2>
                <p>Activity: <span id="activity">Waiting...</span></p>
                <p>Score: <span id="score">0.00</span></p>
            </div>
        </div>
        <button id="startBtn" class="btn">Start Recognition</button>
        <button id="stopBtn" class="btn" style="display:none;">Stop Recognition</button>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
