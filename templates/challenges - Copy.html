<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenges - Athlete Activity Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="challenges-page">
    <nav>
        <div class="nav-container">
            <h2>Athlete Activity Recognition</h2>
            <ul>
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('profile') }}">Profile</a></li>
                <li><a href="{{ url_for('athlete_fitness') }}">Athlete Fitness</a></li>
                <li><a href="{{ url_for('settings') }}">Settings</a></li>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Fitness Challenges</h1>
        <div class="challenges-container">
            <div class="add-challenge-section">
                <h2>Add New Challenge</h2>
                <form id="addChallengeForm">
                    <div class="form-group">
                        <label for="challengeDesc">Challenge Description:</label>
                        <input type="text" id="challengeDesc" name="challengeDesc" required>
                    </div>
                    <div class="form-group">
                        <label for="challengeDate">Date:</label>
                        <input type="date" id="challengeDate" name="challengeDate" required>
                    </div>
                    <div class="form-group">
                        <label for="challengeTime">Time:</label>
                        <input type="time" id="challengeTime" name="challengeTime" required>
                    </div>
                    <button type="submit" class="btn">Add Challenge</button>
                </form>
            </div>

            <div class="challenges-list-section">
                <h2>Your Challenges</h2>
                <div id="challengesList"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
