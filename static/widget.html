<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSA Quick Stats Widget</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 12px;
      background: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 16px;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #111;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 220px;
      margin: 4px 0;
      padding: 6px 8px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .metric span:first-child {
      font-weight: 600;
    }

    footer {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>🏅 SSA Quick Stats</h2>

  <div class="metric">
    <span>Speed</span>
    <span>8.9 km/h</span>
  </div>

  <div class="metric">
    <span>Endurance</span>
    <span>92%</span>
  </div>

  <div class="metric">
    <span>Score</span>
    <span>86/100</span>
  </div>

  <footer>Smart Sports Athlete</footer>
</body>
</html>
