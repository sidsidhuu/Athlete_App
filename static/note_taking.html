<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SSA Notes</title>
    <style>
      body { font-family: sans-serif; padding: 1rem; text-align: center; }
      textarea { width: 90%; height: 120px; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <h3>New Training Note</h3>
    <textarea id="note" placeholder="Write your training notes..."></textarea><br/>
    <button onclick="saveNote()">Save</button>

    <script>
      async function saveNote() {
        const text = document.getElementById('note').value.trim();
        if (!text) return alert('Enter something');
        try {
          const res = await fetch('/api/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: text })
          });
          alert(res.ok ? 'Note saved!' : 'Failed');
        } catch (e) {
          alert('Offline: note will sync later.');
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
              type: 'QUEUE_REQUEST',
              request: { url: '/api/notes', method: 'POST', body: { content: text } }
            });
          }
        }
      }
    </script>
  </body>
</html>
