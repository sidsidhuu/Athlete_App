<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Score - Athlete Activity Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="performance-page">
    <nav>
        <div class="nav-container">
            <h2>Athlete Activity Recognition</h2>
            <ul>
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('profile') }}">Profile</a></li>
                <li><a href="{{ url_for('athlete_fitness') }}">Athlete Fitness</a></li>
                <li><a href="{{ url_for('settings') }}">Settings</a></li>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Performance Score</h1>
        <div class="performance-container">
            <div class="performance-card">
                <h2>Your Performance Results</h2>
                <div class="score-display">
                    <div class="score-circle">
                        <span id="overallScore" class="score-number">0.00</span>
                        <span class="score-label">Overall Score</span>
                    </div>
                </div>

                <div class="activity-breakdown">
                    <h3>Activity Breakdown</h3>
                    <div id="activityScores" class="activity-scores-list">
                        <!-- Activity scores will be populated here -->
                    </div>
                </div>

                <div class="performance-insights">
                    <h3>Performance Insights</h3>
                    <div id="insights" class="insights-content">
                        <!-- Insights will be populated here -->
                    </div>
                </div>

                <div class="performance-actions">
                    <button id="backToFitness" class="btn">Back to Athlete Fitness</button>
                    <button id="saveScore" class="btn">Save Score</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
